<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title">
  <title id="title">TeamTown</title>
  <!-- Isometric grid: dx 30, dy 17.32 (30°), wall height 32. Light from top left. -->
  <!-- Left wall (lit) -->
  <polygon points="20,43.3 50,60.6 50,92.6 20,75.3" fill="#5A4A3F"/>
  <!-- Right wall (shade) -->
  <polygon points="50,60.6 80,43.3 80,75.3 50,92.6" fill="#3A2D26"/>
  <!-- Roof (terracotta) with inset parapet -->
  <polygon points="50,26 80,43.3 50,60.6 20,43.3" fill="#D9653B"/>
  <polygon points="50,29.8 73.4,43.3 50,56.8 26.6,43.3" fill="#E27A52"/>
  <!-- Open doorway spilling warm light -->
  <polygon points="30.8,62.98 39.2,67.83 39.2,86.39 30.8,81.54" fill="#E8B04A"/>
  <!-- Door leaf swung open -->
  <polygon points="30.8,62.98 24.9,66.38 24.9,84.94 30.8,81.54" fill="#B54D2A"/>
  <!-- Lit windows -->
  <polygon points="55.4,64.52 62.6,60.37 62.6,69.33 55.4,73.48" fill="#E8B04A"/>
  <polygon points="67.4,57.59 74.6,53.44 74.6,62.4 67.4,66.55" fill="#E8B04A" opacity="0.6"/>
  <!-- Presence dot: someone is here -->
  <circle cx="50" cy="13" r="6.5" fill="#8FB59A"/>
  <circle cx="48" cy="11" r="2" fill="#FBF6EE" opacity="0.55"/>
</svg>
