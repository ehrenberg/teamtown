# Local Git hooks (ADR-0028). CI runs the same checks, hooks just give earlier feedback.
pre-commit:
  piped: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,cjs,json,md,css,yml,yaml,astro}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: pnpm exec eslint --max-warnings=0 --fix {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
