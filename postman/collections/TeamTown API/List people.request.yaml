$kind: http-request
method: GET
url: '{{baseUrl}}/people'
order: 9000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200', () => pm.response.to.have.status(200));
      const { people } = pm.response.json();
      pm.test('matches PeopleListResponse', () => {
        pm.expect(people).to.be.an('array').and.not.empty;
        for (const person of people) {
          pm.expect(person.personId).to.match(/^[0-9a-f-]{36}$/);
          pm.expect(person.displayName).to.be.a('string').and.not.empty;
          pm.expect(person.avatarColor).to.match(/^#[0-9a-f]{6}$/i);
        }
      });
      const other = (people ?? []).find((person) => person.displayName === 'Second Demo');
      pm.test('lists the second demo user', () => pm.expect(other).to.be.an('object'));
      if (other) pm.collectionVariables.set('otherPersonId', other.personId);
