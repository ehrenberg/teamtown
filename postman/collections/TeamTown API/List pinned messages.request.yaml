$kind: http-request
method: GET
url: '{{baseUrl}}/channels/:channelId/pinned-messages'
order: 10283
pathVariables:
  - key: channelId
    value: '{{channelId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200', () => pm.response.to.have.status(200));
      pm.test('lists the pinned message', () => {
        const messageIds = pm.response.json().messages.map((message) => message.messageId);
        pm.expect(messageIds).to.eql([pm.collectionVariables.get('messageId')]);
      });
