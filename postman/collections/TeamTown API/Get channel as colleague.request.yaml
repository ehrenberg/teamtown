$kind: http-request
method: GET
url: '{{baseUrl}}/channels/:channelId'
order: 10600
pathVariables:
  - key: channelId
    value: '{{channelId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{secondAccessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200', () => pm.response.to.have.status(200));
      pm.test('the message counts as unread for the colleague', () => pm.expect(pm.response.json().unreadCount).to.equal(1));
