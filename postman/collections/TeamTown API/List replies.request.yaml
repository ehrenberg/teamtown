$kind: http-request
method: GET
url: '{{baseUrl}}/channels/:channelId/messages/:rootMessageId/replies'
order: 10220
pathVariables:
  - key: channelId
    value: '{{channelId}}'
  - key: rootMessageId
    value: '{{messageId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200', () => pm.response.to.have.status(200));
      pm.test('holds the reply', () => {
        const { messages } = pm.response.json();
        pm.expect(messages.map((message) => message.messageId)).to.eql([pm.collectionVariables.get('replyId')]);
      });
