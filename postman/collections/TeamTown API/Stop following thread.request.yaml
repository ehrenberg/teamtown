$kind: http-request
method: DELETE
url: '{{baseUrl}}/channels/:channelId/threads/:rootMessageId/follow'
order: 10250
pathVariables:
  - key: channelId
    value: '{{channelId}}'
  - key: rootMessageId
    value: '{{messageId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 204', () => pm.response.to.have.status(204));
