$kind: http-request
method: GET
url: '{{baseUrl}}/search/messages?q=hello'
order: 10290
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200', () => pm.response.to.have.status(200));
      pm.test('answers a page of results', () => {
        pm.expect(pm.response.json().results).to.be.an('array');
        pm.expect(pm.response.json().hasMore).to.be.a('boolean');
      });
