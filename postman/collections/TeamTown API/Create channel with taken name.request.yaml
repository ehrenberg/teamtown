$kind: http-request
method: POST
url: '{{baseUrl}}/channels'
order: 9700
body:
  type: json
  content: |-
    { "kind": "public", "name": "general" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 409 channel-name-taken', () => {
        pm.response.to.have.status(409);
        pm.expect(pm.response.json().message).to.equal('channel-name-taken');
      });
