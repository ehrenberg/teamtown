$kind: collection
name: TeamTown API
description: |-
  REST API of the TeamTown server (contracts: packages/contracts). Run it against the local dev stack
  with `pnpm api:test` (see postman/README.md). Realtime messages are covered by Vitest, not by this collection.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
variables:
  - key: accessToken
    value: ''
    description: Set by the collection script; never commit a value.
  - key: accessTokenExpiresAt
    value: '0'
    description: ms since the epoch; set by the collection script.
  - key: floorId
    value: ground-floor
    description: Set by "List floors" to the first floor of the office.
  - key: secondAccessToken
    value: ''
    description: Token of the second demo user (DMs, invitations); set by the collection script.
  - key: secondAccessTokenExpiresAt
    value: '0'
    description: ms since the epoch; set by the collection script.
  - key: myPersonId
    value: ''
    description: Set by "Me".
  - key: otherPersonId
    value: ''
    description: The second demo user; set by "List people".
  - key: channelId
    value: ''
    description: The private channel the messaging requests create; set by "Create private channel".
  - key: messageId
    value: ''
    description: Set by "Post message".
scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: |-
      // Fetches access tokens for both demo users from the dev realm (client teamtown-api-tests, docker/keycloak).
      // The second one stands in for a colleague in DMs and invitations.
      const fetchToken = (prefix, username, password) => {
        const expiresAt = Number(pm.collectionVariables.get(`${prefix}ExpiresAt`) || 0);
        if (pm.collectionVariables.get(prefix) && Date.now() < expiresAt - 30000) return;
        pm.sendRequest(
          {
            url: pm.variables.get('oidcTokenUrl'),
            method: 'POST',
            header: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: {
              mode: 'urlencoded',
              urlencoded: [
                { key: 'grant_type', value: 'password' },
                { key: 'client_id', value: pm.variables.get('oidcClientId') },
                { key: 'username', value: username },
                { key: 'password', value: password },
                { key: 'scope', value: 'openid' },
              ],
            },
          },
          (error, response) => {
            if (error) throw error;
            if (response.code !== 200) throw new Error(`Token request for ${username} failed with ${response.code}`);
            const body = response.json();
            pm.collectionVariables.set(prefix, body.access_token);
            pm.collectionVariables.set(`${prefix}ExpiresAt`, String(Date.now() + body.expires_in * 1000));
          },
        );
      };
      fetchToken('accessToken', pm.variables.get('username'), pm.variables.get('password'));
      fetchToken('secondAccessToken', pm.variables.get('secondUsername'), pm.variables.get('secondPassword'));
