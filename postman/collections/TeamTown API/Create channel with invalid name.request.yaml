$kind: http-request
method: POST
url: '{{baseUrl}}/channels'
order: 9600
body:
  type: json
  content: |-
    { "kind": "public", "name": "Not a name!" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 400 invalid-channel-name', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().message).to.equal('invalid-channel-name');
      });
