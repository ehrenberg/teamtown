$kind: http-request
method: GET
url: '{{baseUrl}}/channels/:channelId/messages'
order: 10500
pathVariables:
  - key: channelId
    value: '{{channelId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{secondAccessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200', () => pm.response.to.have.status(200));
