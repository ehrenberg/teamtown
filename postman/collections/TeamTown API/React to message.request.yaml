$kind: http-request
method: PUT
url: '{{baseUrl}}/channels/:channelId/messages/:messageId/reactions/:emoji'
order: 10260
pathVariables:
  - key: channelId
    value: '{{channelId}}'
  - key: messageId
    value: '{{messageId}}'
  - key: emoji
    value: '%F0%9F%8E%89'
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200', () => pm.response.to.have.status(200));
      pm.test('carries my reaction', () => {
        pm.expect(pm.response.json().reactions).to.eql([{ emoji: '🎉', personIds: [pm.collectionVariables.get('myPersonId')] }]);
      });
