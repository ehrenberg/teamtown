$kind: http-request
method: PUT
url: '{{baseUrl}}/channels/:channelId/messages/:messageId/reactions/:emoji'
order: 10270
pathVariables:
  - key: channelId
    value: '{{channelId}}'
  - key: messageId
    value: '{{messageId}}'
  - key: emoji
    value: 'abc'
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 400 invalid-emoji', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().message).to.equal('invalid-emoji');
      });
