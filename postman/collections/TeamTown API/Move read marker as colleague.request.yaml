$kind: http-request
method: PUT
url: '{{baseUrl}}/channels/:channelId/read-marker'
order: 10700
pathVariables:
  - key: channelId
    value: '{{channelId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{secondAccessToken}}'
body:
  type: json
  content: |-
    { "messageId": "{{messageId}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 204', () => pm.response.to.have.status(204));
