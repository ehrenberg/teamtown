asyncapi: 3.0.0
info:
  title: TeamTown realtime protocol
  version: "1"
  description: |-
    One WebSocket per client. Every message is a MessagePack-encoded envelope `{ t, id?, p }`:
    `t` is the message type, `id` an optional correlation ID, `p` the payload.
    Commands go client → server and are answered with `Ack` or `Nack` when they carry an `id`.
    Events go server → client.

    The protocol version is negotiated with the WebSocket subprotocol `teamtown.v1`.

    Generated from `packages/contracts` by `pnpm asyncapi`. Do not edit by hand.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
defaultContentType: application/msgpack
servers:
  local:
    host: localhost:3000
    protocol: ws
    pathname: /realtime
    description: Local development
channels:
  realtime:
    address: /realtime
    messages:
      Authenticate:
        name: Authenticate
        title: Authenticate
        summary: Authenticates the connection with the OIDC access token. Must be the first command; send again with a refreshed token.
        payload:
          type: object
          properties:
            t:
              type: string
              const: Authenticate
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                accessToken:
                  type: string
                  minLength: 1
                  maxLength: 8192
              required:
                - accessToken
          required:
            - t
            - p
      Ping:
        name: Ping
        title: Ping
        summary: "Clock sync: sends the local time and receives the server time back (Pong)."
        payload:
          type: object
          properties:
            t:
              type: string
              const: Ping
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                clientTime:
                  type: number
              required:
                - clientTime
          required:
            - t
            - p
      JoinFloor:
        name: JoinFloor
        title: JoinFloor
        summary: Enters a floor or switches floors. The server places the avatar at a spawn point and sends a FloorSnapshot.
        payload:
          type: object
          properties:
            t:
              type: string
              const: JoinFloor
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                floorId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - floorId
          required:
            - t
            - p
      MoveTo:
        name: MoveTo
        title: MoveTo
        summary: Walks to a tile on the current floor. The server computes and validates the path.
        payload:
          type: object
          properties:
            t:
              type: string
              const: MoveTo
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                target:
                  type: object
                  properties:
                    x:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    y:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                  required:
                    - x
                    - y
              required:
                - target
          required:
            - t
            - p
      LockConversation:
        name: LockConversation
        title: LockConversation
        summary: "Locks the own conversation: it takes in no new people. Any participant may lock it."
        payload:
          type: object
          properties:
            t:
              type: string
              const: LockConversation
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                conversationId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - conversationId
          required:
            - t
            - p
      UnlockConversation:
        name: UnlockConversation
        title: UnlockConversation
        summary: Unlocks the own conversation.
        payload:
          type: object
          properties:
            t:
              type: string
              const: UnlockConversation
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                conversationId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - conversationId
          required:
            - t
            - p
      RequestConversationToken:
        name: RequestConversationToken
        title: RequestConversationToken
        summary: Asks for a fresh media token for the own conversation, e.g. after a reconnect.
        payload:
          type: object
          properties:
            t:
              type: string
              const: RequestConversationToken
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                conversationId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - conversationId
          required:
            - t
            - p
      SetDoorMode:
        name: SetDoorMode
        title: SetDoorMode
        summary: Changes the door mode of the room the person is in. Any occupant may do this until M4.
        payload:
          type: object
          properties:
            t:
              type: string
              const: SetDoorMode
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                roomId:
                  type: string
                  minLength: 1
                  maxLength: 64
                doorMode:
                  type: string
                  enum:
                    - open
                    - knock
                    - locked
              required:
                - roomId
                - doorMode
          required:
            - t
            - p
      KnockOnRoom:
        name: KnockOnRoom
        title: KnockOnRoom
        summary: Knocks on an occupied knock-mode room. Everyone inside sees the request; it expires after 60 s.
        payload:
          type: object
          properties:
            t:
              type: string
              const: KnockOnRoom
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                roomId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - roomId
          required:
            - t
            - p
      CancelKnock:
        name: CancelKnock
        title: CancelKnock
        summary: Withdraws the own knock.
        payload:
          type: object
          properties:
            t:
              type: string
              const: CancelKnock
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                knockId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - knockId
          required:
            - t
            - p
      AnswerKnock:
        name: AnswerKnock
        title: AnswerKnock
        summary: Admits or declines a knock on the room the person is in. The first answer counts.
        payload:
          type: object
          properties:
            t:
              type: string
              const: AnswerKnock
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                knockId:
                  type: string
                  minLength: 1
                  maxLength: 64
                admit:
                  type: boolean
              required:
                - knockId
                - admit
          required:
            - t
            - p
      RequestRoomCallToken:
        name: RequestRoomCallToken
        title: RequestRoomCallToken
        summary: Asks for a fresh media token for the call of the room the person is in.
        payload:
          type: object
          properties:
            t:
              type: string
              const: RequestRoomCallToken
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                roomId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - roomId
          required:
            - t
            - p
      StartCall:
        name: StartCall
        title: StartCall
        summary: Rings someone who is online, on any floor.
        payload:
          type: object
          properties:
            t:
              type: string
              const: StartCall
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                personId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              required:
                - personId
          required:
            - t
            - p
      InviteToCall:
        name: InviteToCall
        title: InviteToCall
        summary: Rings one more person into the own call. Any participant may; at most 8 people per call.
        payload:
          type: object
          properties:
            t:
              type: string
              const: InviteToCall
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                callId:
                  type: string
                  minLength: 1
                  maxLength: 64
                personId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              required:
                - callId
                - personId
          required:
            - t
            - p
      AnswerCall:
        name: AnswerCall
        title: AnswerCall
        summary: Accepts or declines the call one is being rung for.
        payload:
          type: object
          properties:
            t:
              type: string
              const: AnswerCall
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                callId:
                  type: string
                  minLength: 1
                  maxLength: 64
                accept:
                  type: boolean
              required:
                - callId
                - accept
          required:
            - t
            - p
      LeaveCall:
        name: LeaveCall
        title: LeaveCall
        summary: Hangs up. A call ends when fewer than two participants are left.
        payload:
          type: object
          properties:
            t:
              type: string
              const: LeaveCall
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                callId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - callId
          required:
            - t
            - p
      RequestDirectCallToken:
        name: RequestDirectCallToken
        title: RequestDirectCallToken
        summary: Asks for a fresh media token for the own direct call, e.g. after a reconnect.
        payload:
          type: object
          properties:
            t:
              type: string
              const: RequestDirectCallToken
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                callId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - callId
          required:
            - t
            - p
      ListOnlinePeople:
        name: ListOnlinePeople
        title: ListOnlinePeople
        summary: Asks for everyone who is online, on any floor; answered with OnlinePeople.
        payload:
          type: object
          properties:
            t:
              type: string
              const: ListOnlinePeople
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties: {}
          required:
            - t
            - p
      SetCamera:
        name: SetCamera
        title: SetCamera
        summary: Switches the own camera on (only inside a conversation or call) or off.
        payload:
          type: object
          properties:
            t:
              type: string
              const: SetCamera
            id:
              type: string
              minLength: 1
              maxLength: 64
            p:
              type: object
              properties:
                on:
                  type: boolean
              required:
                - on
          required:
            - t
            - p
      Authenticated:
        name: Authenticated
        title: Authenticated
        summary: The connection is authenticated.
        payload:
          type: object
          properties:
            t:
              type: string
              const: Authenticated
            p:
              type: object
              properties:
                personId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                serverTime:
                  type: number
              required:
                - personId
                - serverTime
              additionalProperties: false
          required:
            - t
            - p
          additionalProperties: false
      Pong:
        name: Pong
        title: Pong
        summary: Answer to Ping with the server time.
        payload:
          type: object
          properties:
            t:
              type: string
              const: Pong
            p:
              type: object
              properties:
                clientTime:
                  type: number
                serverTime:
                  type: number
              required:
                - clientTime
                - serverTime
              additionalProperties: false
          required:
            - t
            - p
          additionalProperties: false
      FloorSnapshot:
        name: FloorSnapshot
        title: FloorSnapshot
        summary: Full state of a floor (avatars, conversations, live door modes and room calls), sent after joining it.
        payload:
          type: object
          properties:
            t:
              type: string
              const: FloorSnapshot
            p:
              type: object
              properties:
                floorId:
                  type: string
                  minLength: 1
                  maxLength: 64
                avatars:
                  type: array
                  items:
                    type: object
                    properties:
                      personId:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      displayName:
                        type: string
                      avatarColor:
                        type: string
                        pattern: ^#[0-9a-f]{6}$
                      tile:
                        type: object
                        properties:
                          x:
                            type: integer
                            minimum: 0
                            maximum: 9007199254740991
                          y:
                            type: integer
                            minimum: 0
                            maximum: 9007199254740991
                        required:
                          - x
                          - y
                        additionalProperties: false
                      movement:
                        anyOf:
                          - type: object
                            properties:
                              from:
                                type: object
                                properties:
                                  x:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                  y:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                required:
                                  - x
                                  - y
                                additionalProperties: false
                              path:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    x:
                                      type: integer
                                      minimum: 0
                                      maximum: 9007199254740991
                                    y:
                                      type: integer
                                      minimum: 0
                                      maximum: 9007199254740991
                                  required:
                                    - x
                                    - y
                                  additionalProperties: false
                              startedAt:
                                type: number
                              speedTilesPerSecond:
                                type: number
                                exclusiveMinimum: 0
                            required:
                              - from
                              - path
                              - startedAt
                              - speedTilesPerSecond
                            additionalProperties: false
                          - type: "null"
                    required:
                      - personId
                      - displayName
                      - avatarColor
                      - tile
                      - movement
                    additionalProperties: false
                conversations:
                  type: array
                  items:
                    type: object
                    properties:
                      conversationId:
                        type: string
                        minLength: 1
                        maxLength: 64
                      participants:
                        type: array
                        items:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      locked:
                        type: boolean
                    required:
                      - conversationId
                      - participants
                      - locked
                    additionalProperties: false
                doorModes:
                  type: array
                  items:
                    type: object
                    properties:
                      roomId:
                        type: string
                        minLength: 1
                        maxLength: 64
                      doorMode:
                        type: string
                        enum:
                          - open
                          - knock
                          - locked
                    required:
                      - roomId
                      - doorMode
                    additionalProperties: false
                roomCalls:
                  type: array
                  items:
                    type: object
                    properties:
                      roomId:
                        type: string
                        minLength: 1
                        maxLength: 64
                      participants:
                        type: array
                        items:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    required:
                      - roomId
                      - participants
                    additionalProperties: false
                onCall:
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                cameraOn:
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              required:
                - floorId
                - avatars
                - conversations
                - doorModes
                - roomCalls
                - onCall
                - cameraOn
              additionalProperties: false
          required:
            - t
            - p
          additionalProperties: false
      AvatarJoined:
        name: AvatarJoined
        title: AvatarJoined
        summary: Someone entered the floor. Sent to everyone on the floor.
        payload:
          type: object
          properties:
            t:
              type: string
              const: AvatarJoined
            p:
              type: object
              properties:
                floorId:
                  type: string
                  minLength: 1
                  maxLength: 64
                avatar:
                  type: object
                  properties:
                    personId:
                      type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    displayName:
                      type: string
                    avatarColor:
                      type: string
                      pattern: ^#[0-9a-f]{6}$
                    tile:
                      type: object
                      properties:
                        x:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        y:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                      required:
                        - x
                        - y
                      additionalProperties: false
                    movement:
                      anyOf:
                        - type: object
                          properties:
                            from:
                              type: object
                              properties:
                                x:
                                  type: integer
                                  minimum: 0
                                  maximum: 9007199254740991
                                y:
                                  type: integer
                                  minimum: 0
                                  maximum: 9007199254740991
                              required:
                                - x
                                - y
                              additionalProperties: false
                            path:
                              type: array
                              items:
                                type: object
                                properties:
                                  x:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                  y:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                required:
                                  - x
                                  - y
                                additionalProperties: false
                            startedAt:
                              type: number
                            speedTilesPerSecond:
                              type: number
                              exclusiveMinimum: 0
                          required:
                            - from
                            - path
                            - startedAt
                            - speedTilesPerSecond
                          additionalProperties: false
                        - type: "null"
                  required:
                    - personId
                    - displayName
                    - avatarColor
                    - tile
                    - movement
                  additionalProperties: false
              required:
                - floorId
                - avatar
              additionalProperties: false
          required:
            - t
            - p
          additionalProperties: false
      AvatarLeft:
        name: AvatarLeft
        title: AvatarLeft
        summary: Someone left the floor. Sent to everyone on the floor.
        payload:
          type: object
          properties:
            t:
              type: string
              const: AvatarLeft
            p:
              type: object
              properties:
                floorId:
                  type: string
                  minLength: 1
                  maxLength: 64
                personId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              required:
                - floorId
                - personId
              additionalProperties: false
          required:
            - t
            - p
          additionalProperties: false
      AvatarPathStarted:
        name: AvatarPathStarted
        title: AvatarPathStarted
        summary: Someone started walking along a server-validated path. Sent to everyone on the floor.
        payload:
          type: object
          properties:
            t:
              type: string
              const: AvatarPathStarted
            p:
              type: object
              properties:
                floorId:
                  type: string
                  minLength: 1
                  maxLength: 64
                personId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                movement:
                  type: object
                  properties:
                    from:
                      type: object
                      properties:
                        x:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        y:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                      required:
                        - x
                        - y
                      additionalProperties: false
                    path:
                      type: array
                      items:
                        type: object
                        properties:
                          x:
                            type: integer
                            minimum: 0
                            maximum: 9007199254740991
                          y:
                            type: integer
                            minimum: 0
                            maximum: 9007199254740991
                        required:
                          - x
                          - y
                        additionalProperties: false
                    startedAt:
                      type: number
                    speedTilesPerSecond:
                      type: number
                      exclusiveMinimum: 0
                  required:
                    - from
                    - path
                    - startedAt
                    - speedTilesPerSecond
                  additionalProperties: false
              required:
                - floorId
                - personId
                - movement
              additionalProperties: false
          required:
            - t
            - p
          additionalProperties: false
      ConversationFormed:
        name: ConversationFormed
        title: ConversationFormed
        summary: A proximity conversation formed. Sent to everyone on the floor.
        payload:
          type: object
          properties:
            t:
              type: string
              const: ConversationFormed
            p:
              type: object
              properties:
                floorId:
                  type: string
                  minLength: 1
                  maxLength: 64
                conversation:
                  type: object
                  properties:
                    conversationId:
                      type: string
                      minLength: 1
                      maxLength: 64
                    participants:
                      type: array
                      items:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    locked:
                      type: boolean
                  required:
                    - conversationId
                    - participants
                    - locked
                  additionalProperties: false
              required:
                - floorId
                - conversation
              additionalProperties: false
          required:
            - t
            - p
          additionalProperties: false
      ConversationChanged:
        name: ConversationChanged
        title: ConversationChanged
        summary: Participants or the lock of a conversation changed. Sent to everyone on the floor.
        payload:
          type: object
          properties:
            t:
