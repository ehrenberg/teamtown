            - p
          additionalProperties: false
      Nack:
        name: Nack
        title: Nack
        summary: The command failed. Codes are stable and translated in the client.
        payload:
          type: object
          properties:
            t:
              type: string
              const: Nack
            p:
              type: object
              properties:
                id:
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 64
                    - type: "null"
                code:
                  type: string
