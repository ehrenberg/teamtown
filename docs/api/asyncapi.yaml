                    - invalid-token
                    - unknown-floor
                    - not-on-floor
                    - unreachable
                    - conversation-not-found
                    - not-in-conversation
                    - door-closed
                    - room-not-found
                    - not-in-room
                    - door-mode-fixed
                    - knock-not-found
                    - knock-pending
                    - knock-not-needed
                    - person-not-online
                    - busy
                    - already-in-call
                    - cannot-call-yourself
                    - call-not-found
                    - not-in-call
                    - call-full
                    - media-unavailable
                    - invalid-message
                    - internal-error
              required:
                - id
                - code
              additionalProperties: false
          required:
            - t
            - p
          additionalProperties: false
