# Receives OTLP from the TeamTown server and fans out: metrics → Prometheus, logs → Loki, traces → Tempo.
# Privacy (ADR-0012/0019): the server scrubs telemetry itself (src/platform/telemetry/telemetry-privacy.ts);
# attributes that could carry presence, message or personal data are dropped here again as a safety net.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}
  attributes/privacy:
    actions:
      - { key: teamtown.position, action: delete }
      - { key: teamtown.path, action: delete }
      - { key: teamtown.message.body, action: delete }
      - { key: teamtown.target, action: delete }
      - { key: client.address, action: delete }
      - { key: client.port, action: delete }
      - { key: network.peer.address, action: delete }
      - { key: network.peer.port, action: delete }
      - { key: user_agent.original, action: delete }
      - { key: url.query, action: delete }
  # Resource attributes that identify a person or reveal local paths (the server does not send them).
  resource/privacy:
    attributes:
      - { key: process.owner, action: delete }
      - { key: process.command, action: delete }
      - { key: process.command_args, action: delete }
      - { key: process.command_line, action: delete }
      - { key: process.executable.path, action: delete }

exporters:
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource/privacy, attributes/privacy, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [resource/privacy, attributes/privacy, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [resource/privacy, attributes/privacy, batch]
      exporters: [otlp/tempo]
