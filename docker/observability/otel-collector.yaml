# Receives OTLP from the TeamTown server and fans out: metrics → Prometheus, logs → Loki, traces → Tempo.
# Privacy (ADR-0012/0019): attributes that could carry presence or message data are dropped here as a safety net.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}
  attributes/privacy:
    actions:
      - { key: teamtown.position, action: delete }
      - { key: teamtown.path, action: delete }
      - { key: teamtown.message.body, action: delete }

exporters:
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [attributes/privacy, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [attributes/privacy, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [attributes/privacy, batch]
      exporters: [otlp/tempo]
