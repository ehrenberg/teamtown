apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Metrics arrive via OTLP push every 15 s (apps/server/src/instrumentation.ts), not by scraping.
      timeInterval: 15s
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
