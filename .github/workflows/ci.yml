name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (format, lint, types, architecture, tests, build, licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Needed by the website's typecheck and build: Astro renders Mermaid diagrams via Playwright (decision N-07).
      - name: Chromium for build-time Mermaid rendering (website)
        run: pnpm --filter @teamtown/website exec playwright install --with-deps chromium

      - name: DCO sign-off
        if: github.event_name == 'pull_request'
        run: pnpm check:dco ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm arch
      - run: pnpm tokens:check
      - run: pnpm asyncapi:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:licenses
