version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      three:
        patterns: ['three', '@types/three', '@react-three/*']
      astro:
        patterns: ['astro', '@astrojs/*']
      lint-and-format:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-plugin-*', 'prettier']
      test:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'jsdom']
    ignore:
      # Held back on purpose (ADR-0028): typescript-eslint supports TypeScript < 6.1,
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
