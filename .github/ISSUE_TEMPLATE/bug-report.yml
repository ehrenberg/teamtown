name: Bug report
description: Something in TeamTown doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues must not be reported here**, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Walk into room …
        2. Click …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Web browser, Desktop app (Windows), Desktop app (macOS), Desktop app (Linux)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TeamTown version or commit
