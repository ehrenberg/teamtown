packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts by default; allow only what needs them.
allowBuilds:
  '@swc/core': true
  electron: true
  esbuild: true
  lefthook: true
  # Optional native add-ons of testcontainers' SSH/Docker client; not needed, so never run.
  cpu-features: false
  protobufjs: false
  ssh2: false
